<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bancada Preditiva - Painel</title>
<style>
  :root{
    --bg:#0F1723; --card:#1C283A; --track:#0D1622;
    --txt:#E8EEF6; --muted:#8CA0B4;
    --ok:#2ECC71; --warn:#F1C40F; --crit:#E74C3C;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:system-ui,Arial,sans-serif;
       padding:16px;max-width:720px;margin:0 auto}
  h1{font-size:18px;font-weight:600}
  .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
  .status{padding:12px 16px;border-radius:10px;font-weight:600;font-size:16px;
          text-align:center;margin-bottom:14px;color:#0b0b0b}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
  .card{background:var(--card);border-radius:12px;padding:14px}
  .card .lbl{color:var(--muted);font-size:12px}
  .card .val{font-size:32px;font-weight:600;margin:6px 0;font-variant-numeric:tabular-nums}
  .card .diag{font-size:12px;color:var(--muted);min-height:16px}
  .bar{height:8px;background:var(--track);border-radius:4px;overflow:hidden}
  .bar>i{display:block;height:100%;width:0;border-radius:4px;transition:width .4s,background .4s}
  .panel{background:var(--card);border-radius:12px;padding:14px;margin-bottom:16px}
  .row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  select,button,input[type=date]{background:var(--bg);color:var(--txt);border:1px solid #2b3b52;
       border-radius:8px;padding:6px 10px;font-size:14px;font-family:inherit}
  button{cursor:pointer;font-weight:600}
  button:disabled{opacity:.5;cursor:default}
  .exp-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .exp-controls label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
  .chartbox{position:relative;width:100%;height:220px}
  .chartbox>canvas{display:block}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:10px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--crit);margin-right:6px}
  .dot.on{background:var(--ok)}
</style>
</head>
<body>
  <h1>Bancada de Manutencao Preditiva</h1>
  <div class="sub">Motor monofasico 220V 1CV - monitoramento remoto</div>

  <div id="status" class="status" style="background:var(--muted)">CONECTANDO...</div>

  <div class="cards">
    <div class="card"><div class="lbl">Corrente (A)</div>
      <div class="val" id="v-corrente">--</div><div class="bar"><i id="b-corrente"></i></div></div>
    <div class="card"><div class="lbl">Temperatura (C)</div>
      <div class="val" id="v-temp">--</div><div class="bar"><i id="b-temp"></i></div></div>
    <div class="card"><div class="lbl">Vibracao (g)</div>
      <div class="val" id="v-vibr">--</div><div class="bar"><i id="b-vibr"></i></div></div>
    <div class="card"><div class="lbl">Frequencia vib (Hz)</div>
      <div class="val" id="v-freq">--</div><div class="diag" id="t-freq">--</div></div>
  </div>

  <div class="panel">
    <div class="row">
      <strong style="font-weight:600">Historico</strong>
      <select id="sel">
        <option value="corrente">Corrente (A)</option>
        <option value="temperatura">Temperatura (C)</option>
        <option value="vibracao">Vibracao (g)</option>
        <option value="freq_vibracao">Frequencia (Hz)</option>
      </select>
    </div>
    <div class="chartbox"><canvas id="grafico"></canvas></div>
  </div>

  <div class="panel">
    <div class="row"><strong style="font-weight:600">Exportar dados</strong></div>
    <div class="exp-controls">
      <label>De<input type="date" id="exp-de"></label>
      <label>Ate<input type="date" id="exp-ate"></label>
      <button id="exp-btn">Exportar CSV</button>
      <span id="exp-status" style="font-size:13px;color:var(--muted)"></span>
    </div>
    <div style="font-size:12px;color:var(--muted);margin-top:8px">
      Para um dia so, deixe "De" e "Ate" com a mesma data. Abre no Excel.
    </div>
  </div>

  <div class="foot"><span id="conn" class="dot"></span><span id="conn-txt">--</span> &middot; ultima leitura: <span id="ultima">--</span></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
// ====== dados do projeto Supabase (Project Settings -> API) ======
const SUPABASE_URL = "https://jnvmmkptkfpfjvpqamtx.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impudm1ta3B0a2ZwZmp2cHFhbXR4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyNTkxMDEsImV4cCI6MjEwMjgzNTEwMX0.9OTsDZf8dlWuWxtNYC3xY1qf3hw12MDBCKO-nx4mgsQ";   // chave "anon public"

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const LIM = {
  corrente:{alerta:5.0, crit:7.0},
  temperatura:{alerta:60, crit:75},
  vibracao:{alerta:0.25, crit:0.40}
};
const CASAS = {corrente:1, temperatura:1, vibracao:2};
const ALVO  = {corrente:'corrente', temperatura:'temp', vibracao:'vibr'};
const ROT_HZ = 1040/60;   // rotacao do motor = 17,33 Hz (1x)

const CSS = getComputedStyle(document.documentElement);
const cOk=CSS.getPropertyValue('--ok'), cWarn=CSS.getPropertyValue('--warn'), cCrit=CSS.getPropertyValue('--crit');
function cor(k,v){ return v>=LIM[k].crit?cCrit : v>=LIM[k].alerta?cWarn : cOk; }

function setCard(k,v){
  document.getElementById('v-'+ALVO[k]).textContent = (v==null?'--':Number(v).toFixed(CASAS[k]));
  const b=document.getElementById('b-'+ALVO[k]);
  b.style.width = (Math.max(0,Math.min(1, v/LIM[k].crit))*100)+'%';
  b.style.background = cor(k,v);
}

// diagnostico da frequencia de vibracao (mesma logica do firmware)
function diagFreq(f){
  if(f==null || f<3) return '--';
  if(Math.abs(f-120)<12 || Math.abs(f-180)<12) return 'rede (normal)';
  const r=f/ROT_HZ;
  if(Math.abs(r-1)<0.15) return '1x - desbalanceamento';
  if(Math.abs(r-2)<0.15) return '2x - desalinhamento';
  if(f>100) return 'alta - verificar rolamento';
  return String(Math.round(f))+' Hz';
}
function setFreq(f){
  document.getElementById('v-freq').textContent = (f==null?'--':Number(f).toFixed(0));
  document.getElementById('t-freq').textContent = diagFreq(f);
}

const ESTADO_COR={PARADO:'var(--muted)',RODANDO:'var(--ok)',ALARME:'var(--crit)',EMERGENCIA:'var(--crit)'};
const ESTADO_TXT={PARADO:'MOTOR PARADO',RODANDO:'MOTOR RODANDO',ALARME:'ALARME',EMERGENCIA:'EMERGENCIA'};

// ------- grafico -------
let historico=[];
const chart=new Chart(document.getElementById('grafico'),{
  type:'line',
  data:{labels:[],datasets:[{data:[],borderColor:'#3aa0ff',backgroundColor:'rgba(58,160,255,.15)',
        borderWidth:2,pointRadius:0,tension:.3,fill:true}]},
  options:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{display:false}},
    scales:{x:{ticks:{color:'#8CA0B4',maxTicksLimit:6},grid:{color:'#1e2c40'}},
            y:{ticks:{color:'#8CA0B4'},grid:{color:'#1e2c40'}}}}
});
function redesenha(){
  const k=document.getElementById('sel').value;
  chart.data.labels=historico.map(p=>new Date(p.data_hora).toLocaleTimeString().slice(0,5));
  chart.data.datasets[0].data=historico.map(p=>p[k]);
  chart.update();
}
document.getElementById('sel').addEventListener('change',redesenha);

// ------- busca periodica -------
async function atualiza(){
  try{
    const {data:atual,error:e1}=await db.from('leituras')
      .select('*').order('data_hora',{ascending:false}).limit(1);
    if(e1) throw e1;
    document.getElementById('conn').classList.add('on');
    document.getElementById('conn-txt').textContent='online';
    if(atual&&atual.length){
      const d=atual[0];
      setCard('corrente',d.corrente); setCard('temperatura',d.temperatura); setCard('vibracao',d.vibracao);
      setFreq(d.freq_vibracao);
      const st=d.estado||'PARADO', el=document.getElementById('status');
      el.textContent=ESTADO_TXT[st]||st;
      el.style.background=ESTADO_COR[st]||'var(--muted)';
      el.style.color=(st==='ALARME'||st==='EMERGENCIA')?'#fff':'#0b0b0b';
      document.getElementById('ultima').textContent=new Date(d.data_hora).toLocaleTimeString();
    }
    const {data:hist,error:e2}=await db.from('leituras')
      .select('*').order('data_hora',{ascending:false}).limit(60);
    if(e2) throw e2;
    historico=(hist||[]).slice().reverse();
    redesenha();
  }catch(err){
    document.getElementById('conn').classList.remove('on');
    document.getElementById('conn-txt').textContent='offline';
    console.error(err);
  }
}
atualiza();
setInterval(atualiza, 5000);   // atualiza a cada 5 s

// ------- exportacao por intervalo de datas -------
const hoje = new Date().toLocaleDateString('en-CA');
document.getElementById('exp-de').value  = hoje;
document.getElementById('exp-ate').value = hoje;
document.getElementById('exp-btn').addEventListener('click', exportarCSV);

async function exportarCSV(){
  const de  = document.getElementById('exp-de').value;
  const ate = document.getElementById('exp-ate').value || de;
  const st  = document.getElementById('exp-status');
  const btn = document.getElementById('exp-btn');
  if(!de){ st.textContent = 'Escolha a data inicial.'; return; }

  const ini = de  + 'T00:00:00-03:00';
  const fim = ate + 'T23:59:59-03:00';

  st.textContent = 'Buscando...';
  btn.disabled = true;
  try{
    let linhas = [], passo = 1000, pos = 0, lote;
    do{
      const { data, error } = await db.from('leituras')
        .select('data_hora,corrente,temperatura,vibracao,freq_vibracao,estado')
        .gte('data_hora', ini).lte('data_hora', fim)
        .order('data_hora', { ascending: true })
        .range(pos, pos + passo - 1);
      if(error) throw error;
      lote = data || [];
      linhas = linhas.concat(lote);
      pos += passo;
    } while(lote.length === passo);

    if(!linhas.length){ st.textContent = 'Nenhum dado nesse periodo.'; return; }

    const cab = ['Data/hora','Corrente (A)','Temperatura (C)','Vibracao (g)','Freq vib (Hz)','Estado'];
    const num = v => (v==null ? '' : String(v).replace('.', ','));
    const corpo = linhas.map(r => [
      new Date(r.data_hora).toLocaleString('pt-BR'),
      num(r.corrente), num(r.temperatura), num(r.vibracao), num(r.freq_vibracao), r.estado || ''
    ].join(';'));
    const csv = '﻿' + [cab.join(';'), ...corpo].join('\n');

    const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
    const url  = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'leituras_' + de + '_a_' + ate + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    st.textContent = linhas.length + ' leituras exportadas.';
  }catch(e){
    st.textContent = 'Erro ao exportar: ' + (e.message || e);
    console.error(e);
  }finally{
    btn.disabled = false;
  }
}
</script>
</body>
</html>
