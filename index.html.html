<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bancada Preditiva - Painel</title>
<style>
  :root{
    --bg:#0F1723; --card:#1C283A; --track:#0D1622;
    --txt:#E8EEF6; --muted:#8CA0B4;
    --ok:#2ECC71; --warn:#F1C40F; --crit:#E74C3C;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:system-ui,Arial,sans-serif;
       padding:16px;max-width:720px;margin:0 auto}
  h1{font-size:18px;font-weight:600}
  .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
  .status{padding:12px 16px;border-radius:10px;font-weight:600;font-size:16px;
          text-align:center;margin-bottom:14px;color:#0b0b0b}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
  @media(max-width:520px){.cards{grid-template-columns:1fr}}
  .card{background:var(--card);border-radius:12px;padding:14px}
  .card .lbl{color:var(--muted);font-size:12px}
  .card .val{font-size:32px;font-weight:600;margin:6px 0;font-variant-numeric:tabular-nums}
  .bar{height:8px;background:var(--track);border-radius:4px;overflow:hidden}
  .bar>i{display:block;height:100%;width:0;border-radius:4px;transition:width .4s,background .4s}
  .panel{background:var(--card);border-radius:12px;padding:14px;margin-bottom:16px}
  .row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  select{background:var(--bg);color:var(--txt);border:1px solid #2b3b52;border-radius:8px;padding:6px 10px;font-size:14px}
  canvas{width:100%!important;height:220px!important}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:10px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--crit);margin-right:6px}
  .dot.on{background:var(--ok)}
</style>
</head>
<body>
  <h1>Bancada de Manutencao Preditiva</h1>
  <div class="sub">Motor monofasico 220V 1CV - monitoramento remoto</div>

  <div id="status" class="status" style="background:var(--muted)">CONECTANDO...</div>

  <div class="cards">
    <div class="card"><div class="lbl">Corrente (A)</div>
      <div class="val" id="v-corrente">--</div><div class="bar"><i id="b-corrente"></i></div></div>
    <div class="card"><div class="lbl">Temperatura (C)</div>
      <div class="val" id="v-temp">--</div><div class="bar"><i id="b-temp"></i></div></div>
    <div class="card"><div class="lbl">Vibracao (g)</div>
      <div class="val" id="v-vibr">--</div><div class="bar"><i id="b-vibr"></i></div></div>
  </div>

  <div class="panel">
    <div class="row">
      <strong style="font-weight:600">Historico</strong>
      <select id="sel">
        <option value="corrente">Corrente (A)</option>
        <option value="temperatura">Temperatura (C)</option>
        <option value="vibracao">Vibracao (g)</option>
      </select>
    </div>
    <canvas id="grafico"></canvas>
  </div>

  <div class="foot"><span id="conn" class="dot"></span><span id="conn-txt">--</span> &middot; ultima leitura: <span id="ultima">--</span></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
// ====== PREENCHA com os dados do SEU projeto (Project Settings -> API) ======
const SUPABASE_URL = "https://jnvmmkptkfpfjvpqamtx.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impudm1ta3B0a2ZwZmp2cHFhbXR4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyNTkxMDEsImV4cCI6MjEwMjgzNTEwMX0.9OTsDZf8dlWuWxtNYC3xY1qf3hw12MDBCKO-nx4mgsQ";   // chave "anon public"

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// limites (iguais aos do firmware) para colorir e dimensionar as barras
const LIM = {
  corrente:{alerta:5.0, crit:7.0},
  temperatura:{alerta:60, crit:75},
  vibracao:{alerta:0.15, crit:0.35}
};
const CASAS = {corrente:1, temperatura:1, vibracao:2};
const ALVO  = {corrente:'corrente', temperatura:'temp', vibracao:'vibr'};

const CSS = getComputedStyle(document.documentElement);
const cOk=CSS.getPropertyValue('--ok'), cWarn=CSS.getPropertyValue('--warn'), cCrit=CSS.getPropertyValue('--crit');
function cor(k,v){ return v>=LIM[k].crit?cCrit : v>=LIM[k].alerta?cWarn : cOk; }

function setCard(k,v){
  document.getElementById('v-'+ALVO[k]).textContent = (v==null?'--':Number(v).toFixed(CASAS[k]));
  const b=document.getElementById('b-'+ALVO[k]);
  b.style.width = (Math.max(0,Math.min(1, v/LIM[k].crit))*100)+'%';
  b.style.background = cor(k,v);
}

const ESTADO_COR={PARADO:'var(--muted)',RODANDO:'var(--ok)',ALARME:'var(--crit)',EMERGENCIA:'var(--crit)'};
const ESTADO_TXT={PARADO:'MOTOR PARADO',RODANDO:'MOTOR RODANDO',ALARME:'ALARME',EMERGENCIA:'EMERGENCIA'};

// ------- grafico -------
let historico=[];
const chart=new Chart(document.getElementById('grafico'),{
  type:'line',
  data:{labels:[],datasets:[{data:[],borderColor:'#3aa0ff',backgroundColor:'rgba(58,160,255,.15)',
        borderWidth:2,pointRadius:0,tension:.3,fill:true}]},
  options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
    scales:{x:{ticks:{color:'#8CA0B4',maxTicksLimit:6},grid:{color:'#1e2c40'}},
            y:{ticks:{color:'#8CA0B4'},grid:{color:'#1e2c40'}}}}
});
function redesenha(){
  const k=document.getElementById('sel').value;
  chart.data.labels=historico.map(p=>new Date(p.data_hora).toLocaleTimeString().slice(0,5));
  chart.data.datasets[0].data=historico.map(p=>p[k]);
  chart.update();
}
document.getElementById('sel').addEventListener('change',redesenha);

// ------- busca periodica -------
async function atualiza(){
  try{
    // ultima leitura (valores atuais)
    const {data:atual,error:e1}=await db.from('leituras')
      .select('*').order('data_hora',{ascending:false}).limit(1);
    if(e1) throw e1;
    document.getElementById('conn').classList.add('on');
    document.getElementById('conn-txt').textContent='online';
    if(atual&&atual.length){
      const d=atual[0];
      setCard('corrente',d.corrente); setCard('temperatura',d.temperatura); setCard('vibracao',d.vibracao);
      const st=d.estado||'PARADO', el=document.getElementById('status');
      el.textContent=ESTADO_TXT[st]||st;
      el.style.background=ESTADO_COR[st]||'var(--muted)';
      el.style.color=(st==='ALARME'||st==='EMERGENCIA')?'#fff':'#0b0b0b';
      document.getElementById('ultima').textContent=new Date(d.data_hora).toLocaleTimeString();
    }
    // historico (ultimos 60 pontos, em ordem cronologica)
    const {data:hist,error:e2}=await db.from('leituras')
      .select('*').order('data_hora',{ascending:false}).limit(60);
    if(e2) throw e2;
    historico=(hist||[]).slice().reverse();
    redesenha();
  }catch(err){
    document.getElementById('conn').classList.remove('on');
    document.getElementById('conn-txt').textContent='offline';
    console.error(err);
  }
}
atualiza();
setInterval(atualiza, 4000);   // atualiza a cada 4 s
</script>
</body>
</html>
